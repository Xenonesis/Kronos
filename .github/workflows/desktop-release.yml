name: Desktop Release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
      - "desktop-macos-v*"
      - "desktop-linux-v*"
      - "desktop-windows-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.15.0)"
        required: true
        type: string
      platform:
        description: "Desktop platform to build."
        required: false
        default: all
        type: choice
        options: [all, macos, linux, windows]
      checkout_ref:
        description: "Optional source ref; its desktop versions must match the release tag."
        required: false
        default: ""
        type: string
      publish:
        description: "Upload validated signed assets and publish the GitHub Release."
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_ref || github.event.inputs.tag) || github.ref_name }}
  SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'false' }}
  ONNXRUNTIME_NODE_INSTALL: skip
  NODE_OPTIONS: --max-old-space-size=8192
  # Public key is the owner's base64-encoded minisign public key file, not a placeholder.
  TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}

jobs:
  publish-macos:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos')) || (github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'desktop-v') || startsWith(github.ref_name, 'desktop-macos-v'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-26-intel
            arch: x86_64
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"
      - name: Require owner signing material
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/tauri-release.mjs check-signing
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@boudra"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fresh native desktop and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node packages/desktop-tauri/build.mjs --signed
      - name: Validate artifacts and actual signature sidecars
        run: node scripts/tauri-release.mjs stage --bundle packages/desktop-tauri/src-tauri/target/release/bundle --output release-stage --version ${{ env.DESKTOP_VERSION }} --platform darwin --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-desktop-darwin-${{ matrix.arch }}
          path: release-stage/*
          if-no-files-found: error
          retention-days: 7

  publish-linux:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'linux')) || (github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'desktop-v') || startsWith(github.ref_name, 'desktop-linux-v'))) }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"
      - name: Require owner signing material
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/tauri-release.mjs check-signing
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@boudra"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libclang-dev cmake
      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fresh native desktop and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node packages/desktop-tauri/build.mjs --signed
      - name: Validate artifacts and actual signature sidecars
        run: node scripts/tauri-release.mjs stage --bundle packages/desktop-tauri/src-tauri/target/release/bundle --output release-stage --version ${{ env.DESKTOP_VERSION }} --platform linux --arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: signed-desktop-linux-x86_64
          path: release-stage/*
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows')) || (github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'desktop-v') || startsWith(github.ref_name, 'desktop-windows-v'))) }}
    permissions:
      contents: read
      packages: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"
      - name: Require owner signing material
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/tauri-release.mjs check-signing
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@boudra"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check installer pipeline contracts
        run: node --test scripts/tauri-release.test.mjs scripts/update-and-build-exe.test.mjs scripts/sync-workspace-versions.test.mjs packages/desktop-tauri/build.test.mjs
      - name: Build fresh native NSIS installer and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node packages/desktop-tauri/build.mjs --signed
      - name: Check native boundary and persistence regressions
        shell: bash
        run: |
          set -euo pipefail
          for filter in kernel::access::tests agent::storage::tests agent::runner:: agent::manager::tests kernel::timeline::tests kernel::server_test::tests::test_embedded_daemon_browser_proxy; do
            cargo test --manifest-path packages/desktop-tauri/src-tauri/Cargo.toml --bin paseo-desktop "$filter"
          done
      - name: Smoke the owned native executable in an isolated home and port
        run: node scripts/smoke-native-desktop.mjs --exe packages/desktop-tauri/src-tauri/target/release/paseo-desktop.exe
      - name: Validate artifacts and actual signature sidecars
        run: node scripts/tauri-release.mjs stage --bundle packages/desktop-tauri/src-tauri/target/release/bundle --output release-stage --version ${{ env.DESKTOP_VERSION }} --platform windows --arch x86_64
      - name: Generate Windows package-manager manifests from validated installer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-windows-package-manifests.mjs --version "$DESKTOP_VERSION" \
            --installer "release-stage/Kronos_${DESKTOP_VERSION}_x64-setup.exe" --output package-manifests
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-manager-manifests
          path: package-manifests/
          if-no-files-found: error
          retention-days: 7
      - name: Submit package manifests to Windows Package Manager
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        shell: bash
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: node scripts/submit-winget-package.mjs --version "$DESKTOP_VERSION" --manifests-dir package-manifests/winget
      - uses: actions/upload-artifact@v4
        with:
          name: signed-desktop-windows-x86_64
          path: release-stage/*
          if-no-files-found: error
          retention-days: 7

  finalize-release:
    needs: [publish-macos, publish-linux, publish-windows]
    if: ${{ !cancelled() && (needs.publish-macos.result == 'success' || needs.publish-macos.result == 'skipped') && (needs.publish-linux.result == 'success' || needs.publish-linux.result == 'skipped') && (needs.publish-windows.result == 'success' || needs.publish-windows.result == 'skipped') && (needs.publish-macos.result == 'success' || needs.publish-linux.result == 'success' || needs.publish-windows.result == 'success') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ env.CHECKOUT_REF }}
      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-desktop-*
          path: signed-platforms
      - name: Preserve published platforms for partial rebuilds
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tauri-release.mjs fetch-previous --version ${{ env.DESKTOP_VERSION }} --output previous-release --required required-platforms.json
      - name: Revalidate artifacts and merge signed updater metadata
        shell: bash
        run: |
          set -euo pipefail
          preservation=()
          if [[ "$SHOULD_PUBLISH" == "true" && "$IS_SMOKE_TAG" != "true" ]]; then
            preservation=(--previous previous-release --required required-platforms.json)
          fi
          node scripts/tauri-release.mjs merge --input signed-platforms --output release-assets \
            --version "$DESKTOP_VERSION" "${preservation[@]}"
      - uses: actions/download-artifact@v4
        if: needs.publish-windows.result == 'success'
        with:
          name: windows-package-manager-manifests
          path: package-manifests
      - uses: actions/upload-artifact@v4
        with:
          name: validated-desktop-release
          path: |
            release-assets/*
            package-manifests/
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated assets and publish release
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG"; then
            flags=(--draft)
            if [[ "$IS_PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --title "Kronos $RELEASE_TAG" --notes "" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "${{ github.repository }}"
          if [[ -d package-manifests ]]; then
            gh release upload "$RELEASE_TAG" package-manifests/winget/* package-manifests/scoop/* \
              --clobber --repo "${{ github.repository }}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --repo "${{ github.repository }}"
