[package]
name = "paseo-desktop"
version = "0.15.0-beta.1"
description = "Kronos Desktop App"
authors = ["Kronos"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
dirs = "6.0"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.8"
similar = { version = "2.6", features = ["inline"] }
gix = { version = "0.66", default-features = false, features = [
  "status",
  "worktree-mutation",
  "revision",
] }
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tantivy = "0.22"
yrs = "0.21"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
whisper-rs = { version = "0.16.0", optional = true }
mimalloc = { version = "0.1", default-features = false }
rkyv = { version = "0.7", features = ["validation"] }
notify = "6.1.1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
  "multipart",
] }
url = "2.5"
percent-encoding = "2.3"
bcrypt = "0.16"
subtle = "2.6"
vt100 = "0.15"
chacha20poly1305 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[features]
default = ["local-whisper"]
local-whisper = ["dep:whisper-rs"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Dwm",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Console",
  "Win32_System_IO",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
strip = false

[profile.test]
opt-level = 1
